version: 2.1
jobs:
  build:
    docker:
      - image: cimg/ruby:3.2-browsers
      - image: mongo:7.0
        environment:
          MONGO_INITDB_DATABASE: makerspace_test
      - image: redis
    resource_class: large
    steps:
      - checkout
      - run:
          name: Check environment
          command: |
            ruby -v
            which ruby
            google-chrome --version
            chromedriver --version
            node -v
      - run:
          name: Install Bundler
          command: |
            gem install bundler
            bundle -v
      - restore_cache:
          keys:
            - bundle-v3-{{ checksum "Gemfile.lock" }}
            - bundle-v3-
      - run:
          name: Bundle install
          command: bundle install --path vendor/bundle --jobs 4 --retry 3
      - save_cache:
          key: bundle-v3-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle
      - run:
          name: Wait for MongoDB
          command: |
            for i in $(seq 1 30); do
              mongosh --eval "db.runCommand({ ping: 1 })" --quiet && break
              echo "Waiting for mongo... ($i)"
              sleep 2
            done
      - run:
          name: Create mongoid_search indexes
          command: |
            bundle exec rails runner "
              Mongoid.purge!
              Member.create_indexes
              Payment.create_indexes
              puts 'Indexes created'
            "
      - run:
          name: Clear React cache
          command: rm -rf tmp/makerspace-react && echo "React cache cleared"
      - run:
          name: E2E
          command: bundle exec rake integration
          no_output_timeout: 30m
      - run:
          name: UT
          command: bundle exec rspec
      - store_artifacts:
          path: ./tmp/makerspace-react/tmp/screenshots
  publish:
    docker:
      - image: cimg/ruby:3.2-browsers
    resource_class: large
    steps:
      - checkout
      - run:
          name: Install Bundler
          command: |
            gem install bundler
            bundle -v
      - restore_cache:
          keys:
            - bundle-v3-{{ checksum "Gemfile.lock" }}
            - bundle-v3-
      - run:
          name: Bundle install
          command: bundle install --path vendor/bundle --jobs 4 --retry 3
      - save_cache:
          key: bundle-v3-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle
      - run:
          name: Publish
          command: |
            git config --global user.email circleci@circleci
            git config --global user.name CircleCI
            bundle exec rake publish
workflows:
  workflow:
    jobs:
      - build
      - publish:
          filters:
            branches:
              only: master
          requires:
            - build
